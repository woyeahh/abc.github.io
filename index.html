<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>深讀 · iPad 單欄版</title>
<style>
:root{
  --bg:#e8deee;
  --bg2:#f8f4fb;
  --card:#ffffffee;
  --line:#cdbfd8;
  --line2:#d9ead9;
  --ink:#223022;
  --muted:#536253;
  --green:#2f6c45;
  --green2:#5c8a69;
  --tip:#f5fbf5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family: "Noto Serif TC", "Noto Serif JP", serif;
  background:
    radial-gradient(ellipse at 15% 10%, rgba(255,255,255,.45) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 85%, rgba(197,178,214,.25) 0%, transparent 55%),
    var(--bg);
  color:var(--ink);
  min-height:100vh;
}
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; flex-wrap:wrap; gap:.75rem;
  align-items:center; justify-content:center;
  padding:.9rem 1rem calc(.9rem + env(safe-area-inset-top));
  background:rgba(255,255,255,.84);
  backdrop-filter: blur(12px);
  border-bottom:1px solid rgba(180,190,180,.4);
  box-shadow:0 2px 14px rgba(40,70,40,.06);
}
.logo{
  font-size:1.08rem; font-weight:700; letter-spacing:.14em; color:var(--green);
}
.keywrap{
  display:flex; align-items:center; gap:.5rem;
  flex:1 1 360px; max-width:560px;
}
.keywrap label,.small,.status{
  font-family:"Noto Sans TC","Noto Sans JP",sans-serif;
}
.keywrap label{font-size:.78rem; color:var(--muted); white-space:nowrap}
.keywrap input{
  flex:1; min-width:0;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fffdf8;
  padding:.72rem .9rem;
  font-size:.92rem;
}
.btn{
  border:1px solid var(--green);
  background:var(--green);
  color:#fff;
  border-radius:12px;
  padding:.72rem 1rem;
  min-height:44px;
  font-size:.92rem;
  cursor:pointer;
}
.btn.alt{background:transparent;color:var(--green)}
.wrap{max-width:980px; margin:0 auto; padding:1rem 1rem 3rem}
.panel{
  background:var(--card);
  border:1px solid rgba(205,191,216,.9);
  border-radius:24px;
  box-shadow:0 8px 28px rgba(60,80,60,.06);
}
.input-panel{padding:1.2rem 1.2rem 1rem; margin-top:1rem}
.input-panel h1{margin:.1rem 0 .45rem; font-size:2rem; color:var(--green)}
.desc{color:var(--muted); line-height:1.8; font-size:.95rem}
textarea{
  width:100%; min-height:180px; resize:vertical;
  margin-top:1rem; padding:1rem 1.05rem;
  border-radius:16px; border:1px solid var(--line);
  background:#fffefb; color:var(--ink);
  font: 1.06rem/1.95 "Noto Serif JP", "Noto Serif TC", serif;
}
.actions{display:flex; gap:.65rem; flex-wrap:wrap; align-items:center; margin-top:.85rem}
.small{font-size:.8rem; color:var(--muted); line-height:1.7}
.status{font-size:.84rem; color:var(--green2)}
.error{display:none; margin-top:.8rem; color:#8a3d2c; background:#fff0ea; border:1px solid #efc6b9; border-radius:12px; padding:.8rem .9rem; font-family:"Noto Sans TC",sans-serif}
.error.show{display:block}
.reader{display:none; margin-top:1.2rem}
.reader.show{display:block}
.header{padding:1.4rem 1.2rem 0; text-align:center}
.header .meta{font-size:.82rem; letter-spacing:.12em; color:var(--muted); font-family:"Noto Sans TC",sans-serif}
.header .title{font-size:2.1rem; color:var(--green); margin:.4rem 0 .45rem}
.header .sub{font-size:.94rem; color:var(--muted); line-height:1.8; font-family:"Noto Sans TC",sans-serif}
.card{margin-top:1rem; padding:1.35rem 1.15rem 1.4rem; position:relative}
.card::before{content:""; position:absolute; left:0; top:18px; bottom:18px; width:5px; border-radius:0 4px 4px 0; background:linear-gradient(180deg, var(--green), #7db18a)}
.para{font-size:1.28rem; line-height:2.3}
.sent-row{margin:0 0 1rem}
.sent{
  display:block; padding:.26rem .42rem; border-radius:10px; cursor:pointer;
  transition:background .15s ease;
}
.sent:hover,.sent.active{background:rgba(47,108,69,.07)}
.sent-note{
  margin-top:.18rem; min-height:2.35em;
  padding:.26rem .42rem .32rem;
  border-bottom:1px dashed rgba(47,108,69,.22);
  background:linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,0));
  border-radius:10px 10px 4px 4px;
  font-size:.88em; line-height:1.9; outline:none;
  white-space:pre-wrap; word-break:break-word;
}
.sent-note:focus{background:rgba(255,255,255,.9); border-bottom-color:rgba(47,108,69,.55)}
.tip{
  position:fixed; z-index:50; display:none; max-width:min(560px, calc(100vw - 24px));
  background:rgba(245,251,245,.96); border:1px solid #9fc6a7; border-radius:16px;
  box-shadow:0 10px 28px rgba(50,90,50,.12);
  padding:.9rem 1rem; line-height:2;
  pointer-events:none;
}
.tip.show{display:block}
.tip .lab{font:.72rem/1.4 "Noto Sans TC",sans-serif; letter-spacing:.1em; color:#547d59; margin-bottom:.35rem}
.tip .body{font-size:1rem}
@media (max-width: 768px){
  .wrap{padding:.8rem .8rem 2rem}
  .input-panel{padding:1rem}
  .input-panel h1{font-size:1.65rem}
  .header .title{font-size:1.78rem}
  .card{padding:1.1rem .95rem 1.2rem}
  .para{font-size:1.08rem; line-height:2.05}
  textarea{min-height:150px; font-size:1rem}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">深讀</div>
  <div class="keywrap">
    <label for="apiKey">DeepSeek Key</label>
    <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off">
  </div>
  <button class="btn" id="analyzeBtn">切句＆分析</button>
  <button class="btn alt" id="clearBtn">清除</button>
  <button class="btn alt" id="exportBtn">匯出 HTML</button>
</div>

<div class="wrap">
  <section class="panel input-panel" id="inputPanel">
    <h1>日語精讀工具 · iPad 單欄版</h1>
    <div class="desc">這版已拿掉摘錄板與高亮功能，只保留單欄閱讀、逐句翻譯、以及每句下方的筆記線。</div>
    <textarea id="jpInput" placeholder="請貼入日文文章。&#10;建議：標題獨立成行、段落之間空一行。&#10;會先本地切句，再逐句翻譯成繁體中文。"></textarea>
    <div class="actions">
      <div class="small">金鑰僅存瀏覽器，不外傳 ｜ 先切句，再背景逐句翻譯 ｜ 依 。！？ 切句，括號不切句 ｜ Ctrl / Cmd + Enter 送出</div>
      <div class="status" id="statusText"></div>
    </div>
    <div class="error" id="errBox"></div>
  </section>

  <section class="reader" id="reader">
    <div class="header">
      <div class="meta" id="entryMeta"></div>
      <div class="title" id="entryTitle">日語文章</div>
      <div class="sub">先切句，再逐句翻譯 ・ 輕觸或停留句子可看中文翻譯 ・ 版面已調整為適合 iPad 的單欄閱讀</div>
    </div>
    <div class="panel card">
      <div class="para" id="cardsContainer"></div>
    </div>
  </section>
</div>

<div class="tip" id="jpTip">
  <div class="lab">中文翻譯</div>
  <div class="body" id="jpTipBody"></div>
</div>

<script>
const STORAGE_KEY = 'shindoku_ipad_clean_rebuilt_20260414';
let sentences = [];
let inputTitle = '日語文章';

const $ = sel => document.querySelector(sel);
const apiKeyEl = $('#apiKey');
const inputEl = $('#jpInput');
const readerEl = $('#reader');
const statusEl = $('#statusText');
const errEl = $('#errBox');
const cardsEl = $('#cardsContainer');
const tipEl = $('#jpTip');
const tipBodyEl = $('#jpTipBody');

function escH(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function showError(msg){
  errEl.textContent = msg || '';
  errEl.classList.toggle('show', !!msg);
}
function setStatus(msg){ statusEl.textContent = msg || ''; }
function setButtons(disabled){
  $('#analyzeBtn').disabled = disabled;
  $('#clearBtn').disabled = disabled;
  $('#exportBtn').disabled = disabled;
}
function saveState(){
  const notes = {};
  document.querySelectorAll('.sent-note').forEach(el => { notes[el.dataset.idx] = el.innerText || ''; });
  const state = {
    input: inputEl.value,
    title: inputTitle,
    sentences,
    notes,
    apiKey: apiKeyEl.value || ''
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const state = JSON.parse(raw);
    inputEl.value = state.input || '';
    apiKeyEl.value = state.apiKey || '';
    inputTitle = state.title || '日語文章';
    sentences = Array.isArray(state.sentences) ? state.sentences : [];
    if(sentences.length){
      renderPage(state.notes || {});
      return true;
    }
  }catch(e){ console.error(e); }
  return false;
}
function clearAll(){
  inputEl.value = '';
  sentences = [];
  inputTitle = '日語文章';
  cardsEl.innerHTML = '';
  readerEl.classList.remove('show');
  showError('');
  setStatus('');
  localStorage.removeItem(STORAGE_KEY);
}
function splitJapaneseSentences(text){
  const src = String(text || '').replace(/\r\n?/g, '\n').trim();
  if(!src) return [];
  const CLOSE = new Set(['」','』','）',')','〉','》','】','〕']);
  const END = new Set(['。','！','？','!','?']);
  const out = [];
  let buf = '';
  const pushBuf = () => {
    const v = buf.trim();
    if(v) out.push(v);
    buf = '';
  };
  for(let i=0;i<src.length;i++){
    const ch = src[i];
    if(ch === '\n'){
      pushBuf();
      continue;
    }
    buf += ch;
    if(END.has(ch)){
      while(i+1 < src.length && CLOSE.has(src[i+1])){ i++; buf += src[i]; }
      pushBuf();
    }
  }
  pushBuf();
  return out;
}
function preprocessInput(raw){
  const lines = String(raw || '').replace(/\r\n?/g, '\n').split('\n').map(v => v.trim()).filter(Boolean);
  const merged = [];
  for(const line of lines){
    if(!merged.length){ merged.push(line); continue; }
    const prev = merged[merged.length-1];
    if(/[。！？!?」』）)]$/.test(prev) || /^[「『（(]/.test(line)) merged.push(line);
    else merged[merged.length-1] += line;
  }
  return merged.join('\n');
}
async function callDeepSeek(messages, maxTokens=4000){
  const key = apiKeyEl.value.trim();
  if(!key) throw new Error('請先輸入 DeepSeek API Key');
  const r = await fetch('https://api.deepseek.com/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${key}` },
    body: JSON.stringify({
      model:'deepseek-chat',
      temperature:0,
      max_tokens:maxTokens,
      messages
    })
  });
  if(!r.ok){
    let msg = `HTTP ${r.status}`;
    try{
      const e = await r.json();
      msg = e.error?.message || msg;
    }catch(_){ }
    throw new Error(msg);
  }
  const data = await r.json();
  return data.choices?.[0]?.message?.content || '';
}
function extractJSON(raw){
  let s = String(raw || '').replace(/```json\s*/gi,'').replace(/```/g,'').trim();
  try{return JSON.parse(s);}catch(_){ }
  const m = s.match(/\{[\s\S]*\}/);
  if(!m) throw new Error('找不到 JSON');
  return JSON.parse(m[0]);
}
function groupSentences(items, maxChars=900, maxItems=8){
  const groups = [];
  let cur = [], chars = 0;
  for(const item of items){
    const extra = cur.length ? 1 : 0;
    if(cur.length && (chars + item.jp.length + extra > maxChars || cur.length >= maxItems)){
      groups.push(cur);
      cur = [item];
      chars = item.jp.length;
    }else{
      cur.push(item);
      chars += item.jp.length + extra;
    }
  }
  if(cur.length) groups.push(cur);
  return groups;
}
function renderPage(noteMap={}){
  $('#entryTitle').textContent = inputTitle;
  $('#entryMeta').textContent = `共 ${sentences.length} 句`;
  cardsEl.innerHTML = '';
  sentences.forEach((s, idx) => {
    const row = document.createElement('div');
    row.className = 'sent-row';

    const sent = document.createElement('span');
    sent.className = 'sent';
    sent.dataset.idx = String(idx);
    sent.dataset.cn = s.zh || '';
    sent.innerHTML = escH(s.jp || '');
    row.appendChild(sent);

    const note = document.createElement('div');
    note.className = 'sent-note';
    note.dataset.idx = String(idx);
    note.setAttribute('contenteditable','plaintext-only');
    note.setAttribute('spellcheck','false');
    note.innerText = noteMap[idx] || s.note || '';
    note.addEventListener('input', () => {
      sentences[idx].note = note.innerText || '';
      saveState();
    });
    row.appendChild(note);

    cardsEl.appendChild(row);
  });
  bindSentenceTips();
  readerEl.classList.add('show');
  saveState();
}
function placeTipByRect(rect){
  const vw = window.innerWidth, vh = window.innerHeight;
  const w = Math.min(560, vw - 24);
  tipEl.style.maxWidth = w + 'px';
  tipEl.style.display = 'block';
  const th = tipEl.offsetHeight || 120;
  let left = rect.left + rect.width / 2 - w / 2;
  let top = rect.top - th - 12;
  if(left < 12) left = 12;
  if(left + w > vw - 12) left = vw - w - 12;
  if(top < 12) top = rect.bottom + 12;
  if(top + th > vh - 12) top = vh - th - 12;
  tipEl.style.left = left + 'px';
  tipEl.style.top = top + 'px';
}
function showTipFor(el){
  const text = el.dataset.cn || '（翻譯中…）';
  tipBodyEl.textContent = text;
  document.querySelectorAll('.sent.active').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  placeTipByRect(el.getBoundingClientRect());
  tipEl.classList.add('show');
}
function hideTip(){
  tipEl.classList.remove('show');
  tipEl.style.display = 'none';
  document.querySelectorAll('.sent.active').forEach(n => n.classList.remove('active'));
}
function bindSentenceTips(){
  document.querySelectorAll('.sent').forEach(el => {
    el.addEventListener('mouseenter', () => showTipFor(el));
    el.addEventListener('mousemove', () => showTipFor(el));
    el.addEventListener('mouseleave', hideTip);
    el.addEventListener('click', (e) => { e.preventDefault(); showTipFor(el); });
  });
}
async function translateAll(){
  const pending = sentences.map((s, idx) => ({ idx, jp: s.jp, zh: s.zh || '' }));
  const groups = groupSentences(pending);
  let done = 0;
  for(const group of groups){
    const payload = group.map((x, i) => ({ i: i+1, jp: x.jp }));
    const sys = '你是日文句子翻譯器。使用者已經先切好句子。不得合併、不得拆分、不得改順序。只回傳 JSON，格式為 {"s":[{"z":"繁體中文翻譯"}]}，數量必須與輸入完全一致。';
    const user = JSON.stringify(payload);
    const raw = await callDeepSeek([
      {role:'system', content: sys},
      {role:'user', content: user}
    ], 3600);
    const data = extractJSON(raw);
    const arr = Array.isArray(data?.s) ? data.s : [];
    if(arr.length !== group.length) throw new Error('翻譯回傳數量不一致');
    arr.forEach((item, i) => {
      const realIdx = group[i].idx;
      sentences[realIdx].zh = String(item?.z || '').trim() || '（翻譯暫不可用）';
      const el = document.querySelector(`.sent[data-idx="${realIdx}"]`);
      if(el) el.dataset.cn = sentences[realIdx].zh;
    });
    done += 1;
    setStatus(`翻譯中 ${done}/${groups.length} 組…`);
    saveState();
  }
  setStatus(`完成，共 ${sentences.length} 句`);
}
async function analyze(){
  const raw = inputEl.value.trim();
  if(!raw) return;
  setButtons(true);
  showError('');
  try{
    inputTitle = '日語文章';
    const text = preprocessInput(raw);
    const sents = splitJapaneseSentences(text).map(jp => ({ jp, zh:'（翻譯中…）', note:'' }));
    if(!sents.length) throw new Error('未能切出任何句子');
    sentences = sents;
    renderPage();
    setStatus(`已切句，共 ${sentences.length} 句；正在翻譯…`);
    await translateAll();
  }catch(e){
    console.error(e);
    showError('分析失敗：' + e.message);
  }finally{
    setButtons(false);
  }
}
function exportCurrentHtml(){
  const notes = {};
  document.querySelectorAll('.sent-note').forEach(el => { notes[el.dataset.idx] = el.innerText || ''; });
  const state = { input: inputEl.value, title: inputTitle, sentences, notes, apiKey: '' };
  const doc = document.documentElement.cloneNode(true);
  const keyInput = doc.querySelector('#apiKey');
  if(keyInput) keyInput.setAttribute('value','');
  const stateScript = doc.createElement('script');
  stateScript.id = 'exported-state-script';
  stateScript.textContent = `window.__EXPORTED_STATE__ = ${JSON.stringify(state).replace(/<\//g, '<\\/')};`;
  doc.body.appendChild(stateScript);
  const html = '<!DOCTYPE html>\n' + doc.outerHTML;
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'deepread_ipad_clean.html';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function hydrateExportedState(){
  if(!window.__EXPORTED_STATE__) return false;
  const state = window.__EXPORTED_STATE__;
  inputEl.value = state.input || '';
  inputTitle = state.title || '日語文章';
  sentences = Array.isArray(state.sentences) ? state.sentences : [];
  renderPage(state.notes || {});
  setStatus(`已載入匯出內容，共 ${sentences.length} 句`);
  return true;
}

$('#analyzeBtn').addEventListener('click', analyze);
$('#clearBtn').addEventListener('click', clearAll);
$('#exportBtn').addEventListener('click', exportCurrentHtml);
inputEl.addEventListener('keydown', (e) => {
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter') analyze();
});
apiKeyEl.addEventListener('input', saveState);
inputEl.addEventListener('input', saveState);
document.addEventListener('click', (e) => {
  if(!e.target.closest('.sent')) hideTip();
});
window.addEventListener('resize', () => {
  const active = document.querySelector('.sent.active');
  if(active && tipEl.classList.contains('show')) showTipFor(active);
});

try{
  const savedKey = localStorage.getItem(STORAGE_KEY);
  if(savedKey) loadState();
  if(window.__EXPORTED_STATE__) hydrateExportedState();
}catch(e){ console.error(e); }
</script>
</body>
</html>
